<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pénalité</title>

<style>
body{
  margin:0;
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#140000;
  color:white;
  font-family:monospace;
  text-align:center;
}

.card{
  padding:30px;
}

h1{
  color:#ff4d4d;
  font-size:40px;
  animation: flash 1s infinite;
}

.timer{
  font-size:80px;
  margin-top:20px;
}

.go{
  display:none;
  font-size:50px;
  color:#00ff88;
  margin-top:20px;
}

@keyframes flash{
  50%{opacity:0.4;}
}
</style>
</head>

<body>

<div class="card">
  <h1>ALERTE</h1>
  <div>QR ENNEMI DÉTECTÉ</div>
  <div>1 MINUTE DE PÉNALITÉ</div>
  <div class="timer" id="timer">60</div>
  <div class="go" id="go">TOP DÉPART</div>
</div>

<script>
let time = 60;
let ctx = new (window.AudioContext || window.webkitAudioContext)();

// 🔊 fonction son
function beep(freq, duration, volume=0.05){
  let osc = ctx.createOscillator();
  let gain = ctx.createGain();

  osc.connect(gain);
  gain.connect(ctx.destination);

  osc.frequency.value = freq;
  gain.gain.value = volume;

  osc.start();
  setTimeout(()=>osc.stop(), duration);
}

// 🔴 ALARME
function alarm(){
  beep(900,150);
  setTimeout(()=>beep(600,150),150);
  setTimeout(()=>beep(900,150),300);
  setTimeout(()=>beep(600,150),450);
}
alarm();

// 🎧 bruit de fond (radio/guerre léger)
setInterval(()=>{
  beep(120 + Math.random()*40, 120, 0.01);
},900);

// ⏱ chrono
let interval = setInterval(()=>{

  time--;
  document.getElementById("timer").innerText = time;

  // bip normal
  beep(500,50);

  // 🔥 derniers 10 sec
  if(time <= 10){
    beep(1000,80);
  }

  if(time <= 0){
    clearInterval(interval);

    document.getElementById("timer").style.display="none";
    document.getElementById("go").style.display="block";

    // 🎉 son final
    beep(1200,200);
    setTimeout(()=>beep(1500,250),200);
    setTimeout(()=>beep(1800,300),400);
  }

},1000);
</script>

</body>
</html>
